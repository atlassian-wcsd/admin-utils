# ============================================================
# Atlassian Org User Email Fetcher - Configuration
# ============================================================
# Find your Org ID in the Atlassian Admin URL:
#   https://admin.atlassian.com/o/<ORG_ID>/...
ATLASSIAN_ORG_ID=YOUR_ORG_ID_HERE

# Email address of the Org Admin account used for authentication.
# (Informational only - used together with the API token below)
ATLASSIAN_ADMIN_EMAIL=admin@yourcompany.com

# API token for the Org Admin account.
# Generate one at: https://id.atlassian.com/manage-profile/security/api-tokens
ATLASSIAN_API_TOKEN=YOUR_API_TOKEN_HERE

# ============================================================
# Input / Output file settings
# ============================================================
# Path to the input CSV file.
# Can be a filename relative to the repo root OR an absolute path.
INPUT_FILE=sample_active_usage.csv

# Path for the output CSV file.
# Leave blank to overwrite the input file in-place.
OUTPUT_FILE=

# ============================================================
# CSV column settings (optional - defaults shown below)
# ============================================================
# Name of the column in the CSV that holds Atlassian Account IDs
CSV_USER_ID_COLUMN=user_id

# Name of the column that will be written with resolved email addresses
CSV_EMAIL_COLUMN=email
